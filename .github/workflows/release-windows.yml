name: Windows Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: git update-index --chmod=+x gradlew
        shell: bash

      - name: Build Windows Packages (MSI & EXE)
        run: ./gradlew packageDistributionForCurrentOS --no-daemon

      - name: List built binaries
        run: |
          Get-ChildItem -Path "build\compose\binaries\main\" -Recurse -File | Select-Object FullName, Length

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/compose/binaries/main/msi/*.msi
            build/compose/binaries/main/exe/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
